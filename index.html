<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La Cuisine d'Abe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1E4FA8">
<meta name="description" content="Les recettes d'Abe : chercher, cuisiner, partager.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: one-column phone app — sticky greeting header, big search, A–Z grouped list, fixed bottom nav.
   Palette: tekhelet blue (the blue of the tallit) on a blue-biased paper, honey gold as the single warm accent. */
:root {
  --bg: #F3F6FB;
  --surface: #FFFFFF;
  --surface-2: #E8EEF8;
  --ink: #14213D;
  --muted: #56627C;
  --line: #D6DEEC;
  --accent: #1E4FA8;
  --accent-ink: #FFFFFF;
  --honey: #C98A0B;
  --honey-soft: #FBF0D6;
  --meat: #B23A3A;
  --dairy: #2C76B8;
  --parve: #2F8452;
  --danger: #B42318;
  --shadow: 0 1px 2px rgba(20,33,61,.06), 0 4px 16px rgba(20,33,61,.06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --radius: 14px;
  --nav-h: 68px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1322; --surface: #161F34; --surface-2: #1E2A45; --ink: #E7ECF6; --muted: #9AA6C0; --line: #2A3653;
    --accent: #7FA7F2; --accent-ink: #0D1322; --honey: #F2C14E; --honey-soft: #33290F;
    --meat: #F08A8A; --dairy: #79B8F0; --parve: #7FD19F; --danger: #FF8A80;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1322; --surface: #161F34; --surface-2: #1E2A45; --ink: #E7ECF6; --muted: #9AA6C0; --line: #2A3653;
  --accent: #7FA7F2; --accent-ink: #0D1322; --honey: #F2C14E; --honey-soft: #33290F;
  --meat: #F08A8A; --dairy: #79B8F0; --parve: #7FD19F; --danger: #FF8A80;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
html[data-size="large"] { font-size: 19px; }
html[data-size="xl"] { font-size: 22px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
img { max-width: 100%; }
a { color: var(--accent); }
.wrap { padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-width: 760px; margin: 0 auto; }
main { padding-bottom: calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
.muted { color: var(--muted); }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 48px; padding: 0 1.1em; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.honey { background: var(--honey); border-color: var(--honey); color: #1B1405; }
.btn.danger { color: var(--danger); border-color: currentColor; background: transparent; }
.btn.block { width: 100%; }
.btn.small { min-height: 40px; font-size: .9rem; padding: 0 .9em; }
.btn svg { width: 1.2em; height: 1.2em; flex: none; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 0; background: transparent;
  display: inline-grid; place-items: center; color: inherit; flex: none;
}
.icon-btn svg { width: 26px; height: 26px; }
.icon-btn.on-photo { background: rgba(13,19,34,.55); color: #fff; backdrop-filter: blur(6px); }

/* ---------- Header ---------- */
.top { padding-block: 20px 8px; display: grid; gap: 4px; }
.top .dates { display: flex; flex-wrap: wrap; gap: .25em .9em; font-size: .9rem; color: var(--muted); }
.top .dates .heb { color: var(--honey); font-weight: 700; }
.greet { font-size: 2rem; font-weight: 800; }
.greet .name { color: var(--accent); }

.banner {
  margin-top: 14px; padding: 14px 16px; border-radius: var(--radius);
  background: var(--honey-soft); border: 1.5px solid color-mix(in srgb, var(--honey) 40%, transparent);
  display: grid; gap: 8px;
}
.banner h3 { font-size: 1.15rem; }
.banner .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.banner .times { display: flex; flex-wrap: wrap; gap: 4px 18px; font-variant-numeric: tabular-nums; }
.banner .times b { font-size: 1.15rem; }

/* ---------- Search ---------- */
.searchbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-block: 12px 10px;
}
.search {
  display: flex; align-items: center; gap: 4px; background: var(--surface); border: 2px solid var(--line);
  border-radius: 999px; padding-left: 14px; box-shadow: var(--shadow);
}
.search:focus-within { border-color: var(--accent); }
.search svg.lead { width: 22px; height: 22px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 14px 6px; font-size: 1.05rem; outline: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: .9rem; white-space: nowrap;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.chip.on .dot { box-shadow: 0 0 0 2px var(--accent-ink); }
.listmeta { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px 4px; flex-wrap: wrap; }
.listmeta > * { min-width: 0; }
.listmeta select { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; font-weight: 700; max-width: 11em; min-height: 40px; }
.listmeta .btn { white-space: nowrap; }

/* ---------- Recipe list ---------- */
.letter {
  font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; color: var(--accent);
  padding: 18px 0 6px; border-bottom: 2px solid var(--line); margin-bottom: 4px; scroll-margin-top: 150px;
}
.cards { display: grid; gap: 2px; }
.card {
  display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center;
  padding: 10px 4px; border-radius: 12px; text-decoration: none; color: inherit;
}
.card:active { background: var(--surface-2); }
.thumb {
  width: 76px; height: 76px; border-radius: 12px; object-fit: cover; background: var(--surface-2);
  display: grid; place-items: center; overflow: hidden; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 2rem;
}
.card h3 { font-size: 1.1rem; font-family: var(--font-body); font-weight: 700; letter-spacing: 0; }
.card .meta { font-size: .88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 2px; }
.card .side { display: grid; justify-items: end; gap: 6px; }
.card .min { min-width: 0; }
.star-fav { color: var(--honey); width: 22px; height: 22px; }
.kbadge { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: .8rem; }
.kbadge::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.k-meat { color: var(--meat); } .k-dairy { color: var(--dairy); } .k-parve { color: var(--parve); }
.dot.k-meat, .dot.k-dairy, .dot.k-parve { background: currentColor; }

.az {
  position: fixed; right: max(2px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; z-index: 25; padding: 6px 2px; border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 85%, transparent); touch-action: none; user-select: none;
}
.az span { font-size: .68rem; font-weight: 700; line-height: 1.22; width: 22px; text-align: center; color: var(--line); }
.az span.has { color: var(--accent); }
.az-pop {
  position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%); z-index: 60;
  width: 96px; height: 96px; border-radius: 24px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 3rem;
}

.empty { text-align: center; padding: 40px 8px; display: grid; gap: 14px; justify-items: center; }
.empty h2 { font-size: 1.5rem; }
.empty p { max-width: 34ch; margin: 0; color: var(--muted); }

.fab {
  position: fixed; z-index: 30; right: calc(18px + env(safe-area-inset-right, 0px));
  bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  height: 60px; padding: 0 22px 0 18px; border-radius: 999px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.05rem;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(30,79,168,.35);
}
.fab svg { width: 28px; height: 28px; }

/* ---------- Bottom nav ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.nav .in { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 760px; margin: 0 auto; height: var(--nav-h); }
.nav a {
  display: grid; justify-items: center; align-content: center; gap: 2px; text-decoration: none;
  color: var(--muted); font-size: .78rem; font-weight: 700; position: relative;
}
.nav a svg { width: 26px; height: 26px; }
.nav a.on { color: var(--accent); }
.nav a.on::before { content: ""; position: absolute; top: 0; width: 36px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.nav .count {
  position: absolute; top: 8px; left: calc(50% + 6px); background: var(--honey); color: #1B1405;
  font-size: .7rem; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px;
}

/* ---------- Recipe page ---------- */
.hero { position: relative; max-width: 760px; margin: 0 auto; }
.hero .ph { width: 100%; aspect-ratio: 4 / 3; max-height: 52vh; object-fit: cover; display: block; background: var(--surface-2); }
.hero .ph.art { display: grid; place-items: center; color: rgba(255,255,255,.92); font-family: var(--font-display); font-weight: 800; font-size: 6rem; }
.hero .bar {
  position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-right, 0px)) 0 calc(10px + env(safe-area-inset-left, 0px));
}
.hero .bar .r { display: flex; gap: 8px; }
.rtitle { padding-block: 18px 6px; display: grid; gap: 10px; }
.rtitle h1 { font-size: 2.1rem; font-weight: 800; }
.badges { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.badge { border-radius: 999px; padding: 3px 10px; font-size: .82rem; font-weight: 700; background: var(--surface-2); }
.badge.kosher-p { background: var(--honey-soft); color: var(--ink); border: 1px solid var(--honey); }
.stars { display: inline-flex; gap: 2px; }
.stars button { border: 0; background: none; padding: 4px; color: var(--line); width: 40px; height: 40px; }
.stars button.on { color: var(--honey); }
.stars svg { width: 30px; height: 30px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-block: 14px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.fact b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.fact span { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 8px 4px; }
.section { margin-top: 26px; }
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.section-h h2 { font-size: 1.45rem; }
.scaler { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 2px; }
.scaler button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 1.3rem; font-weight: 700; }
.scaler span { min-width: 7.5em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.ing { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.ing li label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 6px; border-radius: 10px; cursor: pointer; }
.ing li label:active { background: var(--surface-2); }
.ing input { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--parve); flex: none; }
.ing input:checked + span { text-decoration: line-through; color: var(--muted); }
.ing .sub, .steps .sub { font-family: var(--font-display); font-weight: 700; color: var(--honey); padding: 14px 6px 2px; list-style: none; font-size: 1.05rem; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; counter-reset: st; }
.steps li.step { display: grid; grid-template-columns: 38px 1fr; gap: 12px; counter-increment: st; }
.steps li.step::before {
  content: counter(st); width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-family: var(--font-display);
}
.steps li.step.done { opacity: .5; }
.timer-chip {
  display: inline-flex; align-items: center; gap: 4px; border: 1.5px solid var(--honey); background: var(--honey-soft);
  border-radius: 999px; padding: 0 10px; font-weight: 700; color: var(--ink); min-height: 32px; vertical-align: baseline;
}
.timer-chip svg { width: 16px; height: 16px; color: var(--honey); }
.notes { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--honey); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; }
.cooked { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-top: 26px; }

/* ---------- Forms ---------- */
.page-h {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; gap: 8px; padding-block: 8px; border-bottom: 1px solid var(--line);
}
.page-h h1 { font-size: 1.35rem; flex: 1; min-width: 0; }
.form { display: grid; gap: 18px; padding-block: 18px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-weight: 700; }
.field .hint { font-size: .85rem; color: var(--muted); }
.input, .form textarea, .form select {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 1rem;
}
.form textarea { min-height: 9em; resize: vertical; line-height: 1.55; }
.input:focus, .form textarea:focus, .form select:focus { border-color: var(--accent); outline: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.photo-drop {
  border: 2px dashed var(--line); border-radius: var(--radius); background: var(--surface);
  min-height: 170px; display: grid; place-items: center; text-align: center; padding: 16px; position: relative; overflow: hidden;
}
.photo-drop img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 10px; display: block; }
.photo-drop .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg label { text-align: center; padding: 10px 4px; border-radius: 9px; font-weight: 700; font-size: .9rem; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--surface); box-shadow: var(--shadow); }
.seg label.k-meat:has(input:checked) { color: var(--meat); }
.seg label.k-dairy:has(input:checked) { color: var(--dairy); }
.seg label.k-parve:has(input:checked) { color: var(--parve); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.toggle input { width: 26px; height: 26px; accent-color: var(--accent); }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
.importbox { background: var(--surface-2); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; }
.importbox h3 { font-size: 1.05rem; }
.draft-note { background: var(--honey-soft); border-radius: 12px; padding: 12px 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.savebar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
}
.savebar .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }

/* ---------- Lists & settings ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.panel h2 { font-size: 1.2rem; }
.stack { display: grid; gap: 14px; padding-block: 16px; }
.shop-add { display: flex; gap: 8px; }
.shop-add input { flex: 1; min-width: 0; }
.shop-group h3 { font-size: 1rem; font-family: var(--font-body); color: var(--muted); padding: 10px 4px 2px; }
.shop-item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.shop-item label { flex: 1; display: flex; gap: 12px; align-items: center; cursor: pointer; min-width: 0; }
.shop-item input { width: 26px; height: 26px; accent-color: var(--parve); flex: none; }
.shop-item.done span { text-decoration: line-through; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--surface-2); border-radius: 12px; padding: 12px 8px; text-align: center; }
.stats b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: .8rem; color: var(--muted); }
.conv-out { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
table.ref { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.ref td, table.ref th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
table.ref th { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.love { text-align: center; color: var(--muted); padding: 10px 0 0; font-size: .95rem; }
.love b { color: var(--accent); font-family: var(--font-display); }

/* ---------- Sheets, toasts, timers ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,12,24,.5); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0;
  padding: 10px var(--gutter-r) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); display: grid; gap: 14px;
  animation: up .22s ease-out;
}
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet h2 { font-size: 1.3rem; }
.sheet .menu { display: grid; gap: 4px; }
.sheet .menu button { display: flex; align-items: center; gap: 14px; text-align: left; border: 0; background: var(--surface); border-radius: 12px; min-height: 56px; padding: 0 16px; font-weight: 700; }
.sheet .menu button svg { width: 24px; height: 24px; color: var(--accent); }
.sheet .menu button.danger { color: var(--danger); } .sheet .menu button.danger svg { color: var(--danger); }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 90px + env(safe-area-inset-bottom, 0px)); z-index: 120;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 700; max-width: calc(100% - 32px); text-align: center;
  box-shadow: var(--shadow);
}
.timers { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 110; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; width: min(420px, calc(100% - 32px)); }
.tmr { display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 16px; box-shadow: var(--shadow); }
.tmr b { font-variant-numeric: tabular-nums; font-size: 1.2rem; }
.tmr span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .85rem; opacity: .8; }
.tmr button { border: 0; border-radius: 999px; height: 36px; padding: 0 12px; font-weight: 700; background: var(--bg); color: var(--ink); }
.tmr.ring { background: var(--honey); color: #1B1405; animation: pulse 1s infinite; }
.tmr.ring button { background: #1B1405; color: #fff; }
@keyframes pulse { 50% { transform: scale(1.03); } }

/* ---------- Cook mode ---------- */
.cook { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); padding: calc(env(safe-area-inset-top, 0px) + var(--tmr-h, 0px)) 0 env(safe-area-inset-bottom, 0px); }
.cook .ch { display: flex; align-items: center; gap: 8px; padding: 8px var(--gutter-r) 8px var(--gutter-l); border-bottom: 1px solid var(--line); }
.cook .ch h2 { flex: 1; font-size: 1.05rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cook .body { overflow: auto; padding: 24px var(--gutter-r) 24px var(--gutter-l); display: grid; align-content: start; gap: 18px; max-width: 760px; margin: 0 auto; width: 100%; }
.cook .num { font-family: var(--font-display); color: var(--honey); font-weight: 800; font-size: 1.1rem; }
.cook .text { font-size: 1.75rem; line-height: 1.4; }
.cook .text .timer-chip { font-size: 1.1rem; }
.cook .progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.cook .progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.cook .foot { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; padding: 10px var(--gutter-r) 12px var(--gutter-l); border-top: 1px solid var(--line); }
.cook .foot .btn { min-height: 64px; font-size: 1.1rem; }

@media (min-width: 640px) {
  .greet { font-size: 2.4rem; }
  .rtitle h1 { font-size: 2.6rem; }
  .hero .ph { border-radius: 0 0 22px 22px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media print {
  .nav, .fab, .hero .bar, .actions, .az, .cooked, .timers, .scaler button, .no-print { display: none !important; }
  body { background: #fff; color: #000; }
  main { padding: 0; }
  .hero .ph { max-height: 260px; }
}
</style>

// Sun altitude crossing (sunrise equation). alt = -0.833 for sunset, -8.5 for nightfall (3 stars).
function sunTime(date, lat, lng, alt) {

const FRAC = { '½': .5, '¼': .25, '¾': .75, '⅓': 1 / 3, '⅔': 2 / 3, '⅛': .125 };

}

  let q = factor === 1 ? m[2].trim() : fmtNum(a * factor);

// Turns "20 min", "1 h 30", "2 heures" into tappable timers.
const TIME_RE = /(\d+(?:[.,]\d+)?)(?:\s*(?:-|–|à|to)\s*(\d+(?:[.,]\d+)?))?\s*(heures?|hours?|hrs?|h|minutes?|mins?|min|mn)\b(?:\s*(\d{1,2})(?!\s*(?:°|min|g\b)))?/gi;

    if (mins > 0 && mins <= 24 * 60) {
      out.push(esc(text.slice(last, idx)));

async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (cookState && document.visibilityState === 'visible') keepAwake(); });
function openCook(r) {
  const st = lines(r.steps).filter(l => !(isHeading(l) && l.length < 60)).map(cleanStep);
  if (!st.length) return;
  cookState = { r, st, i: 0 };
  const el = document.createElement('div'); el.className = 'cook'; el.id = 'cook';
  document.body.append(el); document.body.style.overflow = 'hidden';
  keepAwake(); drawCook();
  let x0 = null;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 70) cookMove(dx < 0 ? 1 : -1); x0 = null; });
}
function drawCook() {
  const { r, st, i } = cookState, t = T(), el = $('#cook');
  el.innerHTML = `<div class="ch"><button class="icon-btn" data-act="cookclose" aria-label="${esc(t.close)}">${ico('x')}</button><h2>${esc(r.title)}</h2>
      <button class="btn small" data-act="cooking">${esc(t.showIng)}</button></div>
    <div class="body"><div class="progress"><i style="width:${((i + 1) / st.length) * 100}%"></i></div>
      <div class="num">${esc(t.step(i + 1, st.length))}</div><div class="text">${withTimers(st[i])}</div></div>
    <div class="foot"><button class="btn" data-act="cookprev" ${i === 0 ? 'disabled' : ''}>${esc(t.prev)}</button>
      <button class="btn primary" data-act="cooknext">${esc(i === st.length - 1 ? t.finish : t.next)}</button></div>`;
}
function cookMove(d) {

  if (d > 0 && c.i === c.st.length - 1) { history.back(); return; }
  c.i = Math.max(0, Math.min(c.st.length - 1, c.i + d)); drawCook();
}
function closeCook() {
  if (!cookState) return;
  $('#cook')?.remove(); document.body.style.overflow = ''; cookState = null;
  try { wakeLock?.release(); } catch {} wakeLock = null;
}

// ---------- Timers ----------
let timers = ls.get('timers', []), audioCtx = null, ringLoop = null;
function addTimer(min, label) {
  timers.push({ id: uid(), end: Date.now() + min * 60000, label, min });
  ls.set('timers', timers); drawTimers();
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch {}
}
function beep() {
  try {
    const ctx = audioCtx || (audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    [0, .25, .5].forEach(dt => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.25, ctx.currentTime + dt); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dt + .2); o.start(ctx.currentTime + dt); o.stop(ctx.currentTime + dt + .22); });
  } catch {}

}
function drawTimers() {
  const box = $('#timers'), now = Date.now(), t = T();
  let ringing = false;
  box.innerHTML = timers.map(x => {
    const left = Math.max(0, Math.round((x.end - now) / 1000)); const done = left === 0; ringing ||= done;
    const hh = Math.floor(left / 3600), mm = Math.floor(left / 60) % 60, ss = String(left % 60).padStart(2, '0');
    const clock = hh ? `${hh}:${String(mm).padStart(2, '0')}:${ss}` : `${mm}:${ss}`;
    return `<div class="tmr ${done ? 'ring' : ''}"><b>${done ? '⏰' : clock}</b><span>${esc(done ? t.timerDone : x.label)}</span><button data-act="tstop" data-id="${x.id}">${esc(t.stop)}</button></div>`;
  }).join('');
  document.body.style.paddingTop = timers.length ? box.offsetHeight + 8 + 'px' : '';
  document.documentElement.style.setProperty('--tmr-h', timers.length ? box.offsetHeight + 8 + 'px' : '0px');
  if (ringing && !ringLoop) {
    beep(); ringLoop = setInterval(beep, 2500);
    try { if (document.visibilityState !== 'visible' && Notification.permission === 'granted') new Notification(t.timerDone, { body: timers.find(x => x.end <= now)?.label || '', icon: 'icons/icon-192.png' }); } catch {}
  }
  if (!ringing && ringLoop) { clearInterval(ringLoop); ringLoop = null; }
}
setInterval(() => { if (timers.length) drawTimers(); }, 1000);
function askTimer(min, label) {
  const t = T();
  sheet(`<h2>${esc(t.timerFor)} · ${fmtDur(min)}</h2><p class="muted" style="margin:0">${esc(label)}</p>
    <div class="scaler" style="justify-self:center"><button data-d="-1">−</button><span id="tm">${fmtDur(min)}</span><button data-d="1">+</button></div>
    <div class="row2"><button class="btn" data-x="no">${esc(t.cancel)}</button><button class="btn primary" data-x="go">${ico('clock')}${esc(t.startTimer)}</button></div>`, (el, close) => {
    el.addEventListener('click', e => {
      const d = e.target.closest('[data-d]')?.dataset.d;
      if (d) { min = Math.max(1, min + (+d) * (min >= 20 ? 5 : 1)); $('#tm', el).textContent = fmtDur(min); }
      const x = e.target.closest('[data-x]')?.dataset.x;
      if (x === 'no') close();
      if (x === 'go') { addTimer(min, label); close(); }
    });
  });
}

// Pasted text → fields
function parseRecipeText(text) {
  const ls_ = String(text).split(/\r?\n/).map(l => l.trim());
  const H_ING = /^(ingr[eé]dients?|ingredients?|il vous faut|liste des ingr[eé]dients)\s*:?$/i;
  const H_STEP = /^(pr[eé]paration|instructions?|[eé]tapes?|m[eé]thode|method|directions|recette|steps|preparation)\s*:?$/i;
  const H_NOTE = /^(notes?|astuces?|conseils?|tips?)\s*:?$/i;
  let mode = 'head', title = '', ing = [], steps = [], notes = [], head = [];
  for (const l of ls_) {
    if (!l) continue;
    if (H_ING.test(l)) { mode = 'ing'; continue; }
    if (H_STEP.test(l)) { mode = 'steps'; continue; }
    if (H_NOTE.test(l)) { mode = 'notes'; continue; }
    ({ head, ing, steps, notes })[mode === 'head' ? 'head' : mode].push(l);
  }
  if (!ing.length && !steps.length) {
    // No headings: short lines that look like quantities are ingredients, long lines are steps.
    const rest = head.slice(1); title = head[0] || '';
    for (const l of rest) (l.length < 70 && !/[.!]$/.test(l) ? ing : steps).push(l);
  } else { title = head[0] || ''; notes = notes.concat(head.slice(1).filter(l => l.length > 40)); }
  const d = { title: title.replace(/^recette\s*:?\s*/i, ''), ingredients: ing.map(l => l.replace(/^[-•*▢☐]\s*/, '')).join('\n'), steps: steps.map(cleanStep).join('\n'), notes: notes.join('\n') };
  const all = norm(text);
  const pers = all.match(/(?:pour|for|serves?|portions?\s*:?)\s*(\d+)\s*(?:personnes?|pers|people|servings|portions)?/);
  if (pers) d.servings = +pers[1];
  const prep = all.match(/(?:preparation|prep(?:\s*time)?)\s*:?\s*(\d+)\s*(min|h)/); if (prep) d.prep = prep[2] === 'h' ? prep[1] * 60 : +prep[1];
  const ck = all.match(/(?:cuisson|cook(?:ing)?(?:\s*time)?)\s*:?\s*(\d+)\s*(min|h)/); if (ck) d.cook = ck[2] === 'h' ? ck[1] * 60 : +ck[1];
  const url = String(text).match(/https?:\/\/\S+/); if (url) d.link = url[0];
  return d;
}

// Link → fields (reads schema.org Recipe data that most recipe sites publish)
const PROXIES = [u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u), u => 'https://corsproxy.io/?url=' + encodeURIComponent(u), u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)];
async function fetchVia(url, asBlob) {
  try { const r = await fetch(url, { signal: AbortSignal.timeout(8000) }); if (r.ok) return asBlob ? r.blob() : r.text(); } catch {}
  for (const p of PROXIES) {
    try { const r = await fetch(p(url), { signal: AbortSignal.timeout(12000) }); if (r.ok) return asBlob ? r.blob() : r.text(); } catch {}
  }
  return null;
}
const isoMin = s => { if (!s || typeof s !== 'string') return ''; const m = s.match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/i); if (!m) return ''; return ((+m[1] || 0) * 1440 + (+m[2] || 0) * 60 + (+m[3] || 0)) || ''; };

function findRecipeLD(doc) {
  const out = [];
  const walk = o => { if (!o || typeof o !== 'object') return; if (Array.isArray(o)) return o.forEach(walk); const ty = [].concat(o['@type'] || []); if (ty.some(x => /Recipe$/i.test(x))) out.push(o); if (o['@graph']) walk(o['@graph']); if (o.mainEntity) walk(o.mainEntity); };
  for (const s of doc.querySelectorAll('script[type="application/ld+json"]')) { try { walk(JSON.parse(s.textContent)); } catch {} }
  return out[0];
}
function stepsFromLD(ins) {
  const out = [];
  const walk = x => {
    if (!x) return;
    if (typeof x === 'string') return txt(x).split(/\n+/).forEach(l => l.trim() && out.push(l.trim()));
    if (Array.isArray(x)) return x.forEach(walk);
    if (/HowToSection/i.test(x['@type'])) { if (x.name) out.push(txt(x.name) + ' :'); return walk(x.itemListElement); }
    if (x.text) out.push(txt(x.text)); else if (x.name) out.push(txt(x.name));
  };
  walk(ins); return out;
}
async function importFromLink(url) {
  const html = await fetchVia(url);
  if (!html) return null;
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const ld = findRecipeLD(doc);
  const meta = n => doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`)?.content;
  if (!ld) { const title = meta('og:title') || doc.title; return title ? { title: txt(title), photo: meta('og:image') || null, link: url, partial: true } : null; }
  let img = ld.image; if (Array.isArray(img)) img = img[0]; if (img && typeof img === 'object') img = img.url || img.contentUrl;
  const yieldN = String([].concat(ld.recipeYield || [])[0] || '').match(/\d+/);
  const kw = typeof ld.keywords === 'string' ? ld.keywords.split(',') : [].concat(ld.keywords || []);
  return {
    title: txt(ld.name), link: url, photo: img || meta('og:image') || null,
    ingredients: [].concat(ld.recipeIngredient || ld.ingredients || []).map(txt).join('\n'),
    steps: stepsFromLD(ld.recipeInstructions).join('\n'),
    servings: yieldN ? +yieldN[0] : '', prep: isoMin(ld.prepTime), cook: isoMin(ld.cookTime) || (isoMin(ld.totalTime) && !isoMin(ld.prepTime) ? isoMin(ld.totalTime) : ''),
    notes: ld.description ? txt(ld.description) : '', tags: kw.map(s => txt(s)).filter(s => s && s.length < 25).slice(0, 5),
  };
}
async function localizePhoto(url) {
  // Save a copy of a web image inside the app so it still shows offline.
  try { const b = await fetchVia(url, true); if (b && b.type.startsWith('image/')) return await compress(b, 1400); } catch {}
  return url;
}

function convert(amount, unit, ingr) {
  const g = CUP_G[ingr][0], isLiquid = ingr === 'water';
  const unitG = isLiquid ? ' ml' : ' g';
  switch (unit) {
    case 'cup': return fmtNum(amount * g) + unitG;
    case 'tbsp': return fmtNum(amount * g / 16) + unitG;
    case 'tsp': return fmtNum(amount * g / 48) + unitG;
    case 'floz': return fmtNum(amount * 29.57) + ' ml';
    case 'oz': return fmtNum(amount * 28.35) + ' g';
    case 'lb': return fmtNum(amount * 453.6) + ' g';
    case 'stick': return fmtNum(amount * 113) + ' g';
    case 'f': { const c = (amount - 32) * 5 / 9; return `${Math.round(c)} °C · Th. ${fmtNum(Math.round(c / 30 * 2) / 2)}`; }
  }
}

async function exportBackup(share) {
  const t = T();
  const data = JSON.stringify({ app: 'la-cuisine-d-abe', version: 1, exported: new Date().toISOString(), recipes, shop }, null, 1);
  const name = `recettes-abe-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([data], name, { type: 'application/json' });
  if (share && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); ls.set('lastBackup', Date.now()); renderMore(); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  ls.set('lastBackup', Date.now()); if (current === 'more') renderMore(); else toast(t.saved);
}
async function importBackup(file) {
  const t = T();
  try {
    const d = JSON.parse(await file.text());
    const list = Array.isArray(d) ? d : d.recipes;
    if (!Array.isArray(list)) throw 0;
    let n = 0;
    for (const r of list) {
      if (!r || !r.id || !r.title) continue;
      const old = byId(r.id);
      if (old && (old.updatedAt || 0) > (r.updatedAt || 0)) continue;
      await saveRecipe(r); n++;
    }
    if (Array.isArray(d.shop) && !shop.length) { shop = d.shop; saveShop(); }
    toast(t.importedN(n)); renderMore();
  } catch { toast(t.badFile); }
}

    case 'shopshare': shareText(t.shopTitle, t.shopTitle + '\n\n' + shop.filter(x => !x.done).map(x => '☐ ' + x.text).join('\n')); break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt = null; } break;
    case 'gps': navigator.geolocation?.getCurrentPosition(p => { S.gps = [p.coords.latitude, p.coords.longitude]; S.city = 'gps'; saveSettings(); renderMore(); }, () => toast(t.gpsFail), { timeout: 15000 }); break;
    case 'backup': exportBackup(false); break;
    case 'backupshare': exportBackup(true); break;
    case 'snooze': ls.set('nudgeSnooze', Date.now() + 14 * 864e5); b.closest('.banner').remove(); break;
    case 'restore': $('#backupInput').click(); break;
    case 'erase': if (await confirmBox(t.eraseQ, t.eraseAll)) { await DB.clear(); recipes = []; toast(t.erased); renderMore(); } break;
  }
});
document.addEventListener('click', e => {
  const c = e.target.closest('#fHol .chip'); if (!c) return;
  c.classList.toggle('on'); c.setAttribute('aria-pressed', c.classList.contains('on'));
  $('#form').dispatchEvent(new Event('input'));
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { L.q = e.target.value; renderResults(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sort') { L.sort = e.target.value; renderResults(); }
});
document.addEventListener('keydown', e => {
  if (!cookState) return;
  if (e.key === 'ArrowRight') cookMove(1); if (e.key === 'ArrowLeft') cookMove(-1);
});
$('#photoInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { formPhoto = await compress(f, 1400); $('#fPhotoUrl').value = ''; drawPhotoBox(); $('#form').dispatchEvent(new Event('input')); } catch { toast('Photo ?'); }
});
$('#backupInput').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });

// ---------- Start ----------
(async function start() {
  applyLook();
  readShareParams();
  const ok = await DB.open();
  try { recipes = await DB.all(); } catch { recipes = []; }
  recipes.forEach(indexRecipe);
  if (!ok) setTimeout(() => toast(T().offlineSave), 800);
  route();
  drawTimers();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
